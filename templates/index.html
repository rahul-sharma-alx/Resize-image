<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Resizer & Compressor</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(760px, 100%); background: white; border: 1px solid #e4e8f0; border-radius: 20px; padding: 28px; box-shadow: 0 12px 40px rgba(25, 35, 55, .08); }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 38px); }
    .sub { margin: 0 0 24px; color: #68738a; }
    label { display: block; font-weight: 650; font-size: 14px; margin-bottom: 7px; }
    input[type=file], input[type=number], select { width: 100%; border: 1px solid #d7dce6; border-radius: 10px; padding: 11px 12px; background: #fff; font: inherit; }
    .drop { border: 2px dashed #cbd3e1; border-radius: 14px; padding: 20px; margin-bottom: 20px; background: #fafbfe; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .full { grid-column: 1 / -1; }
    .checks { display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .check input { width: auto; }
    button { width: 100%; border: 0; border-radius: 11px; padding: 13px 16px; font: inherit; font-weight: 700; cursor: pointer; background: #172033; color: white; }
    button:hover { opacity: .92; }
    .error { background: #fff0f0; color: #a32222; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; }
    .hint { color: #788297; font-size: 12px; margin-top: 6px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } .card { padding: 20px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Image Resizer & Compressor</h1>
    <p class="sub">Compress one or multiple images to a target file size using Pillow.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form action="/compress" method="post" enctype="multipart/form-data">
      <div class="drop">
        <label for="images">Choose images</label>
        <input id="images" name="images" type="file" accept="image/*" multiple required>
        <div class="hint">JPG, PNG, WebP, BMP, TIFF and GIF. Maximum total upload: 4 MB per request on Vercel.</div>
      </div>

      <div class="grid">
        <div>
          <label for="max_kb">Maximum size per image (KB)</label>
          <input id="max_kb" name="max_kb" type="number" min="1" max="3500" value="100" required>
        </div>
        <div>
          <label for="output_format">Output format</label>
          <select id="output_format" name="output_format">
            {% for value, label in formats.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="max_width">Maximum width (px)</label>
          <input id="max_width" name="max_width" type="number" min="16" placeholder="Optional">
        </div>
        <div>
          <label for="max_height">Maximum height (px)</label>
          <input id="max_height" name="max_height" type="number" min="16" placeholder="Optional">
        </div>
        <div>
          <label for="quality">Lowest quality allowed</label>
          <input id="quality" name="quality" type="number" min="1" max="95" value="25">
          <div class="hint">Higher values preserve more quality before resizing.</div>
        </div>
      </div>

      <div class="checks">
        <label class="check"><input type="checkbox" name="skip_smaller" checked> Keep images already below the limit</label>
        <label class="check"><input type="checkbox" name="keep_metadata" checked> Keep EXIF metadata when it fits</label>
      </div>

      <button type="submit">Compress & Download</button>
    </form>
  </main>
</body>
</html>
